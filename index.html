<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout : une seule page plein écran — dessins en haut, feuille au centre, boîte de crayons en bas */
:root{
  --bg:#fff3d6;          /* table en bois clair */
  --tray:#ffe2a8;        /* plumier */
  --tray-edge:#f0c46e;
  --fg:#4a2f1d;
  --ink:#2b2233;         /* trait du dessin, toujours sur papier blanc */
  --paper:#ffffff;
  --ring:#ff5a36;
  --font-display:"Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a2140; --tray:#3a2f57; --tray-edge:#54467a; --fg:#ffe9c2; --ring:#ffb23e; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#2a2140; --tray:#3a2f57; --tray-edge:#54467a; --fg:#ffe9c2; --ring:#ffb23e; color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:10px;
  max-width:720px;margin:0 auto;box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--ring);outline-offset:3px}

/* Accueil */
.home{height:100%;overflow-y:auto;box-sizing:border-box;max-width:720px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 28px;
  display:flex;flex-direction:column;gap:18px}
.logo{display:block;flex:none;width:100%;max-width:620px;height:auto;aspect-ratio:750/200;margin:4px auto 0}
.tagline{margin:-14px 0 0;text-align:center;font-size:1.05rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--fg)}
.home h1{margin:6px 0 0;text-align:center;font-size:1.5rem;font-weight:800;color:var(--ring);letter-spacing:.01em}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:560px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px 14px;border-radius:22px;
  background:var(--tray);box-shadow:inset 0 -5px 0 var(--tray-edge);transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat .pic{width:100%;aspect-ratio:1;border-radius:16px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.cat img{width:88%;height:88%;object-fit:contain;pointer-events:none}
.cat b{font-size:1.25rem;font-weight:800;line-height:1.1}
.cat small{font-size:.9rem;font-weight:600;opacity:.75}
.homebtn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--ring);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2)}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.toplogo{flex:1;min-width:0;height:48px;max-width:220px}
.setbtn{background:#8a5cf6}
.sndbtn{background:#2fbf5b}
.sndbtn .off{display:none}
.sndbtn[aria-pressed="false"]{background:#7a7a86}
.sndbtn[aria-pressed="false"] .on{display:none}
.sndbtn[aria-pressed="false"] .off{display:inline}
.paperbox{position:relative;width:min(100cqw,100cqh);aspect-ratio:1;max-width:100%}
.paperbox .paper{width:100%;height:100%}
.saybtn{background:#36c8e8}
.saybtn.hide{display:none}
.homebtn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* Thèmes */
.themes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.theme{flex:0 0 auto;justify-content:center;display:flex;align-items:center;gap:4px;height:44px;padding:0 12px 0 9px;border-radius:999px;
  background:var(--tray);box-shadow:inset 0 -3px 0 var(--tray-edge);font-weight:800;font-size:1rem;white-space:nowrap}
.theme svg{flex:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.theme[aria-pressed="true"]{background:var(--ring);color:#fff;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2)}
/* Dessins à choisir */
.picks{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;width:64px;height:64px;border-radius:16px;background:var(--paper);
  box-shadow:0 3px 0 var(--tray-edge);border:3px solid transparent;overflow:hidden;transition:transform .15s}
.pick svg,.pick img{width:100%;height:100%;display:block;pointer-events:none;object-fit:contain}
.pick[aria-pressed="true"]{border-color:var(--ring);transform:translateY(-2px)}

/* La feuille */
.sheet{position:relative;min-height:0;display:grid;place-items:center;container-type:size}
.paper{aspect-ratio:1;max-width:100%;background:var(--paper);
  border-radius:22px;box-shadow:0 6px 0 var(--tray-edge),0 10px 24px rgb(0 0 0 / .12);overflow:hidden}
.paper svg,.paper canvas,.paper img{width:100%;height:100%;display:block}
.paper canvas{cursor:pointer}
.ghost{opacity:.5}
.z{fill:#fff;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;transition:fill .18s}
.line{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.dot{fill:var(--ink);pointer-events:none}
.shine{fill:#fff;pointer-events:none}
.pop{animation:pop .3s ease}
@keyframes pop{50%{opacity:.6}}

.bravo{position:absolute;inset:auto 0 18px;margin:auto;width:max-content;padding:6px 22px;border-radius:999px;
  background:var(--ring);color:#fff;font-size:1.8rem;font-weight:800;letter-spacing:.02em;
  transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.bravo.show{transform:scale(1)}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.bravo::before,.bravo::after{content:"★";color:#ffd93b;margin:0 .3em}
.bravo.show{animation:wiggle .6s ease .35s 2}
@keyframes wiggle{25%{transform:scale(1.12) rotate(-5deg)}75%{transform:scale(1.12) rotate(5deg)}}

/* Boîte de crayons */
.namecard{min-height:100%;display:grid;place-items:center;text-align:center;font-size:2.2rem;font-weight:800;line-height:1.1;color:var(--fg);padding:8px;animation:nameIn .35s ease}
@keyframes nameIn{from{transform:scale(.8);opacity:0}}
.tray.naming .colors,.tray.naming .tools{visibility:hidden}
.tray.naming{position:relative}
.tray.naming .namecard{position:absolute;inset:0}
.panels{display:grid}
.panels > *{grid-area:1/1;min-width:0}
.panels > [hidden]{display:grid!important;visibility:hidden}
.stickpanel{display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.motifbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0;flex:1}
.motifprev{width:52px;height:52px;border-radius:16px;background:var(--paper);display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 0 var(--tray-edge)}
.motifprev img{object-fit:contain;transition:width .15s,height .15s}
.sizer{display:flex;gap:8px}
.sizer .tool{width:52px;height:44px}
.motifbar{flex:0 0 auto!important}
.tray{background:var(--tray);border-radius:22px;padding:10px;display:flex;gap:10px;align-items:stretch;
  box-shadow:inset 0 -4px 0 var(--tray-edge)}
.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;justify-items:center;align-content:center}
.stickers{grid-template-columns:repeat(8,1fr);gap:5px}
.panels{flex:1}
.tools.side{flex:0 0 auto;flex-direction:column;justify-content:center;gap:8px}
.sticker-tile,.back-tile{background:var(--paper);box-shadow:0 2px 0 var(--tray-edge),inset 0 0 0 3px var(--ring);display:grid;place-items:center}
.sticker-tile img{width:66%;height:66%;object-fit:contain;pointer-events:none}
.st img{width:78%;height:78%;object-fit:contain;pointer-events:none}
.back-tile{grid-template-columns:1fr 1fr;padding:22%;gap:12%;box-sizing:border-box}
.back-tile span{border-radius:50%;width:100%;aspect-ratio:1}
.back-tile span:nth-child(1){background:#ff4b4b}.back-tile span:nth-child(2){background:#ffd93b}
.back-tile span:nth-child(3){background:#2fbf5b}.back-tile span:nth-child(4){background:#2f7bff}
.st{width:100%;max-width:46px;aspect-ratio:1;border-radius:14px;background:var(--paper);font-size:1.6rem;display:grid;place-items:center;box-shadow:0 2px 0 var(--tray-edge);transition:transform .15s}
.st[aria-pressed="true"]{box-shadow:0 0 0 3px var(--fg)}
.sw{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;background:var(--c);
  box-shadow:inset 0 -5px 0 rgb(0 0 0 / .18),0 2px 0 rgb(0 0 0 / .15);transition:transform .15s}
.sw[aria-pressed="true"]{box-shadow:inset 0 -5px 0 rgb(0 0 0 / .18),0 0 0 3px var(--fg)}
.sw.prev{outline:3px dashed var(--fg);outline-offset:0}
.sw.white[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #d8cbb5,0 0 0 3px var(--fg)}
.sw.white{box-shadow:inset 0 0 0 2px #d8cbb5,inset 0 -5px 0 rgb(0 0 0 / .08)}
.tools{display:flex;gap:12px;justify-content:center;flex:1}
.tools.side .tool{width:52px;height:52px}
.tool{width:60px;height:52px;border-radius:16px;background:var(--paper);display:grid;place-items:center;
  box-shadow:0 4px 0 var(--tray-edge)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tray-edge)}
.motiftool img{width:34px;height:34px;object-fit:contain;pointer-events:none}
.motiftool .dots{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:28px}
.motiftool .dots span{aspect-ratio:1;border-radius:50%}
.motiftool .dots span:nth-child(1){background:#ff4b4b}.motiftool .dots span:nth-child(2){background:#ffd93b}
.motiftool .dots span:nth-child(3){background:#2fbf5b}.motiftool .dots span:nth-child(4){background:#2f7bff}
.tool:disabled{opacity:.35}
.tool svg{width:30px;height:30px;stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{box-shadow:0 0 0 3px var(--fg)}
.tool.ask{background:var(--ring)}
.tool.ask svg{stroke:#fff}
@media (max-width:380px){.colors{gap:6px}}
/* Espace parents : installation de l'appli derrière une petite question */
.parents{align-self:center;margin-top:6px;padding:10px 18px;border-radius:999px;font-size:.95rem;font-weight:700;color:var(--fg);opacity:.7;background:transparent;border:2px dashed var(--tray-edge)}
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgb(43 34 51 / .55);
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.gate-box{width:100%;max-width:420px;background:var(--paper);color:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.gate-box h2{margin:0;font-size:1.3rem;font-weight:800}
.gate-box p{margin:0;font-size:1rem;line-height:1.4;font-weight:600}
.gate-q::first-letter{text-transform:uppercase}
.gate-q{font-size:1.15rem!important;font-weight:800!important;color:var(--ring)}
.gate-ans{height:54px;border-radius:14px;background:#f3ecdf;display:grid;place-items:center;font-size:1.8rem;font-weight:800;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.gate-ans.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{height:52px;border-radius:14px;background:#fff3d6;font-size:1.4rem;font-weight:800;box-shadow:inset 0 -3px 0 var(--tray-edge)}
.keys .ok{background:var(--ring);color:#fff;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2)}
.gate-close{align-self:center;padding:8px 16px;font-weight:700;opacity:.7}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-item{min-height:52px;border-radius:14px;background:#fff3d6;font-size:1.05rem;font-weight:800;text-align:left;padding:0 16px;box-shadow:inset 0 -3px 0 var(--tray-edge)}
.set-sep{border:0;border-top:2px dashed var(--tray-edge);margin:4px 0;width:100%}
.set-item{display:flex;align-items:center;gap:12px}
.set-item svg{flex:none;width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set-item .lock{margin-left:auto;width:20px;height:20px;opacity:.7}
.set-item.cur{background:var(--ring);color:#fff;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2)}
.gate-box{max-height:100%;overflow-y:auto}
.menucats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.set-item.mcat{flex-direction:column;gap:4px;padding:8px 6px 10px;text-align:center;min-height:0}
.mcat .mpic{width:100%;aspect-ratio:1;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden}
.mcat .mpic img{width:90%;height:90%;object-fit:contain;pointer-events:none}
.mcat b{font-size:.95rem;line-height:1.1;font-weight:800}
.set-item.mcat.cur{background:var(--ring);color:#fff}
.set-item.danger{background:#ff4b4b;color:#fff}
.gate-steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-weight:600;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* numéro de version ajouté aux images : un dessin modifié est toujours rechargé */
const VER = '?v=' + document.querySelector('meta[name="build"]').content;
for (const k in IMAGES) IMAGES[k] += VER;

/* ---------- Moteur « pot de peinture » ---------- */
const SIZE = 800, WALL = 140, MIN_ZONE = 150, N = SIZE*SIZE;
const loadImg = src => new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ko; im.src = src; });
const baseInk = {}, motifData = {}, state = {};

async function getBase(name){
  if (baseInk[name]) return baseInk[name];
  const im = await loadImg(IMAGES[name]);
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,SIZE,SIZE); g.drawImage(im,0,0,SIZE,SIZE);
  const px = g.getImageData(0,0,SIZE,SIZE).data, ink = new Uint8Array(N);
  for (let i=0;i<N;i++) ink[i] = 255 - px[i*4];
  return baseInk[name] = ink;
}
async function getMotif(id, scale=1){
  const key = id + '@' + scale;
  if (motifData[key]) return motifData[key];
  const im = await loadImg(MOTIFS[id]);
  const S = Math.round(sizeOf(id) * scale);
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); g.drawImage(im,0,0,S,S);
  const px = g.getImageData(0,0,S,S).data, n = S*S;
  const ink = new Uint8Array(n), alpha = new Float32Array(n);
  for (let i=0;i<n;i++){ alpha[i] = px[i*4+3]/255; ink[i] = 255 - px[i*4]; }
  return motifData[key] = { ink, alpha, S };
}

function labelize(ink){
  const label = new Int32Array(N), sizes = [0], stack = new Int32Array(N);
  let n = 0;
  for (let i=0;i<N;i++){
    if (label[i] || ink[i] > WALL) continue;
    n++; let sp = 0, count = 0; stack[sp++] = i; label[i] = n;
    while (sp){
      const p = stack[--sp]; count++;
      const x = p % SIZE;
      if (x>0 && !label[p-1] && ink[p-1] <= WALL){ label[p-1] = n; stack[sp++] = p-1; }
      if (x<SIZE-1 && !label[p+1] && ink[p+1] <= WALL){ label[p+1] = n; stack[sp++] = p+1; }
      if (p>=SIZE && !label[p-SIZE] && ink[p-SIZE] <= WALL){ label[p-SIZE] = n; stack[sp++] = p-SIZE; }
      if (p<N-SIZE && !label[p+SIZE] && ink[p+SIZE] <= WALL){ label[p+SIZE] = n; stack[sp++] = p+SIZE; }
    }
    sizes.push(count);
  }
  /* le trait prend la couleur de la zone voisine, pour un bord net */
  for (let pass=0; pass<10; pass++){
    let changed = false; const prev = label.slice();
    for (let p=0;p<N;p++){
      if (prev[p]) continue;
      const x = p % SIZE;
      const v = (x>0&&prev[p-1]) || (x<SIZE-1&&prev[p+1]) || (p>=SIZE&&prev[p-SIZE]) || (p<N-SIZE&&prev[p+SIZE]);
      if (v){ label[p] = v; changed = true; }
    }
    if (!changed) break;
  }
  /* zones du dessin : on laisse de côté le fond (ce qui touche le bord) */
  const outside = new Set();
  for (let i=0;i<SIZE;i++){ outside.add(label[i]); outside.add(label[N-SIZE+i]); outside.add(label[i*SIZE]); outside.add(label[i*SIZE+SIZE-1]); }
  const zones = []; let inner = 0;
  for (let k=1;k<=n;k++) if (sizes[k] >= MIN_ZONE && !outside.has(k)){ zones.push(k); inner += sizes[k]; }
  /* Seules les GRANDES zones sont obligatoires pour finir : assez grandes pour un petit doigt
     (au moins 6 000 points, soit environ 1 % de la feuille) et au moins 2,5 % du dessin.
     Les yeux, reflets, petits motifs et petits trous restent facultatifs. */
  let big = zones.filter(k => sizes[k] >= 6000 && sizes[k] >= inner*0.025);
  if (!big.length && zones.length) big = [zones.reduce((a,b)=> sizes[a] >= sizes[b] ? a : b)];
  inner = big.reduce((t,k)=>t+sizes[k],0);
  zones.length = 0; zones.push(...big);
  return { label, zones, sizes, inner };
}

async function compose(name){
  const ink = (await getBase(name)).slice();
  for (const st of (stickers[name] || [])){
    const m = await getMotif(st.m, st.s || 1), S = m.S, x0 = Math.round(st.x - S/2), y0 = Math.round(st.y - S/2);
    for (let j=0;j<S;j++){ const y = y0+j; if (y<0||y>=SIZE) continue;
      for (let i=0;i<S;i++){ const x = x0+i; if (x<0||x>=SIZE) continue;
        const a = m.alpha[j*S+i]; if (!a) continue;
        const p = y*SIZE+x; ink[p] = ink[p]*(1-a) + m.ink[j*S+i]*a; } }
  }
  return state[name] = { ink, ...labelize(ink) };
}

const rgbCache = {};
const rgb = h => rgbCache[h] ||= [1,3,5].map(k=>parseInt(h.slice(k,k+2),16));
function regionColors(name){
  const st = state[name], map = {};
  for (const op of (fills[name] || [])){
    const l = st.label[op.y*SIZE+op.x];
    if (op.c) map[l] = op.c; else delete map[l];
  }
  return map;
}
function paintCanvas(cv, name){
  const st = state[name]; if (!st) return;
  const g = cv.getContext('2d'), out = g.createImageData(SIZE,SIZE), d = out.data;
  const hex = regionColors(name), map = {};
  for (const k in hex) map[k] = rgb(hex[k]);
  const { ink, label } = st;
  for (let i=0; i<N; i++){
    const c = map[label[i]], m = (255 - ink[i]) / 255, o = i*4;
    if (c){ d[o]=c[0]*m; d[o+1]=c[1]*m; d[o+2]=c[2]*m; } else { d[o]=d[o+1]=d[o+2]=255*m; }
    d[o+3] = 255;
  }
  g.putImageData(out,0,0);
}

/* ---------- Affichage ---------- */
let renderToken = 0;
const thumbOf = name => [...document.querySelectorAll('.pick')][ORDER.indexOf(name)];
const sheetCanvas = () => paper.querySelector('canvas');

function renderPicks(){

    b.onclick = () => { current = name; renderPicks(); renderSheet(); announce(); };

}
async function renderSheet(){
  hideBravo();
  const name = current, token = ++renderToken;
  paper.innerHTML = `<img class="ghost" alt="" src="${IMAGES[name]}">`;
  if (!state[name]) await compose(name);
  if (token !== renderToken) return;
  const cv = document.createElement('canvas'); cv.width = cv.height = SIZE;
  paintCanvas(cv, name);
  paper.innerHTML = ''; paper.appendChild(cv);
  updateThumb();
}
/* miniatures coloriées : gardées en mémoire et sur le téléphone */
let thumbs = {};
try { thumbs = JSON.parse(localStorage.getItem('miniatures-v1') || '{}') || {}; } catch(e) { thumbs = {}; }
function updateThumb(){
  const name = current, cv = sheetCanvas(); if (!cv) return;
  const hasWork = (fills[name] || []).length || (stickers[name] || []).length;
  if (hasWork){
    const t = document.createElement('canvas'); t.width = t.height = 200;
    const g = t.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,200,200); g.drawImage(cv,0,0,200,200);
    thumbs[name] = t.toDataURL('image/jpeg', 0.85);
  } else delete thumbs[name];
  try { localStorage.setItem('miniatures-v1', JSON.stringify(thumbs)); } catch(e) {}
  const b = thumbOf(name), img = b && b.querySelector('img');
  if (img) img.src = thumbs[name] || IMAGES[name];
}
let thumbT;
function afterChange(){
  save(); checkDone();
  clearTimeout(thumbT); thumbT = setTimeout(updateThumb, 250);
}
async function refresh(recompose){
  const name = current;
  if (recompose) await compose(name);
  if (name !== current) return;
  const cv = sheetCanvas(); if (cv) paintCanvas(cv, name);
}

/* ---------- Toucher la feuille ---------- */
let busy = false;
paper.addEventListener('click', async e=>{
  const cv = e.target.closest('canvas'); if (!cv || busy) return;
  const st = state[current]; if (!st) return;
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * SIZE / r.width), y = Math.floor((e.clientY - r.top) * SIZE / r.height);
  const list = (stickers[current] ||= []), hist = (history[current] ||= []);

  if (eraser){
    for (let i=list.length-1; i>=0; i--){ const s = list[i];
      const half = sizeOf(s.m)*(s.s || 1)*.42;
      if (Math.abs(s.x-x) < half && Math.abs(s.y-y) < half){
        list.splice(i,1); hist.push({t:'del', s, i});
        busy = true; await refresh(true); busy = false; afterChange(); return; } }
  }
  if (motif && !eraser){
    list.push({m:motif, x, y, s:motifScale}); hist.push({t:'add'});
    busy = true; await refresh(true); busy = false; afterChange(); return;
  }
  /* pot de peinture : on cherche la zone touchée (ou la plus proche si on touche un trait) */
  let px = -1;
  for (let rad=0; rad<=8 && px<0; rad+=2)
    for (let dy=-rad; dy<=rad && px<0; dy+=2) for (let dx=-rad; dx<=rad && px<0; dx+=2){
      const xx=x+dx, yy=y+dy;
      if (xx>=0&&yy>=0&&xx<SIZE&&yy<SIZE&&st.ink[yy*SIZE+xx] <= WALL) px = yy*SIZE+xx;
    }
  if (px < 0) return;
  const next = eraser ? null : color, l = st.label[px];
  if ((regionColors(current)[l] || null) === next) return;
  (fills[current] ||= []).push({x: px % SIZE, y: Math.floor(px / SIZE), c: next});
  hist.push({t:'fill'});
  paintCanvas(cv, current); afterChange();
});

const bravo = document.getElementById('bravo'); let bravoT;
function hideBravo(){ bravo.classList.remove('show'); }
/* Le dessin est « fini » quand presque toute sa surface est coloriée :
   les petites zones (yeux, reflets, détails) et le fond ne sont pas obligatoires. */
const DONE_RATIO = 0.75;
const wasDone = {};
function isDone(name){
  const st = state[name]; if (!st || !st.inner) return false;
  const map = regionColors(name);
  /* toutes les grandes zones doivent être coloriées (le blanc ne compte pas) */
  return st.zones.every(k => map[k] && map[k] !== '#ffffff');
}
function checkDone(){
  const done = isDone(current);
  if (done && !wasDone[current]) celebrate();
  wasDone[current] = done;
}

/* ---------- Fête : pluie d'étoiles ---------- */
const fx = document.createElement('canvas'); fx.className = 'fx'; document.body.appendChild(fx);
const FX_COLORS = ['#ff4b4b','#ff9a2e','#ffd93b','#2fbf5b','#36c8e8','#2f7bff','#8a5cf6','#ff7ac2'];
let parts = [], fxRun = false;
function starPath(g, r){
  g.beginPath();
  for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*.45 : r; g.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  g.closePath();
}
/* ---------- Musique de fin : la gamme au xylophone ---------- */
let actx = null;
function audio(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch(e) { actx = null; }
  return actx;
}
addEventListener('pointerdown', audio, {once:true});
function note(t, midi, dur, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .003);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .05);
}
function mallet(t, midi, vol=.3){ note(t, midi, .35, vol); note(t, midi + 24, .07, vol * .25); }
function playScale(){
  if (!soundOn || !audio()) return;
  const t = actx.currentTime + .05;
  [72,74,76,77,79,81,83,84].forEach((n,i) => mallet(t + i*.075, n));   // do ré mi fa sol la si do
  [72,76,79,84].forEach(n => mallet(t + .7, n, .2)); mallet(t + .7, 60, .3);  // accord final
}

function celebrate(){
  playScale();
  bravo.classList.add('show'); clearTimeout(bravoT); bravoT = setTimeout(hideBravo, 2600);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = paper.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  fx.width = innerWidth*dpr; fx.height = innerHeight*dpr;
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i=0;i<70;i++){
    const a = Math.random()*Math.PI*2, v = 4 + Math.random()*9;
    parts.push({ x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4, r:8 + Math.random()*14, rot:Math.random()*6, vr:(Math.random()-.5)*.3,
      c:FX_COLORS[i % FX_COLORS.length], life:0, max:70 + Math.random()*40, star: i % 3 !== 0 });
  }
  if (!fxRun){ fxRun = true; requestAnimationFrame(tick); }
}
function tick(){
  const g = fx.getContext('2d'), dpr = fx.width / innerWidth;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,fx.width,fx.height); g.scale(dpr,dpr);
  parts = parts.filter(p => p.life < p.max);
  for (const p of parts){
    p.life++; p.vy += .22; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    const k = 1 - p.life/p.max, scale = Math.min(1, p.life/6);
    g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.globalAlpha = Math.min(1, k*1.6);
    g.fillStyle = p.c;
    if (p.star){ starPath(g, p.r*scale); g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(43,34,51,.35)'; g.stroke(); }
    else { g.beginPath(); g.arc(0,0,p.r*.45*scale,0,Math.PI*2); g.fill(); }
    g.restore();
  }
  if (parts.length) requestAnimationFrame(tick); else { fxRun = false; g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,fx.width,fx.height); }
}

/* Aperçu du motif choisi et réglage de sa taille avant de le coller */
const SCALES = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
let motifScale = 1;
const motifPrev = document.getElementById('motifprev');
function showMotifPrev(){
  if (!motif){ motifPrev.innerHTML = ''; return; }
  const px = Math.round(40 * motifScale * (MOTIF_SCALE[motif] || 1));
  motifPrev.innerHTML = `<img alt="" src="${MOTIFS[motif]}" style="width:${px}px;height:${px}px">`;
  document.getElementById('motifminus').disabled = motifScale <= SCALES[0];
  document.getElementById('motifplus').disabled = motifScale >= SCALES[SCALES.length-1];
}
document.getElementById('motifminus').onclick = () => { const i = SCALES.indexOf(motifScale); if (i > 0) motifScale = SCALES[i-1]; showMotifPrev(); };
document.getElementById('motifplus').onclick = () => { const i = SCALES.indexOf(motifScale); if (i < SCALES.length-1) motifScale = SCALES[i+1]; showMotifPrev(); };
function showPanel(which){

  openSt.innerHTML = which === 'stickers' ? COLORS_ICON : MOTIF_ICON;
  openSt.setAttribute('aria-label', which === 'stickers' ? 'revenir aux couleurs' : 'motifs');

  showMotifPrev();

}
let prevColor = null;

document.getElementById('undo').onclick = async () => {
  const h = history[current]; if(!h || !h.length || busy) return;
  const step = h.pop(), list = (stickers[current] ||= []);
  let recompose = false;
  if (step.t === 'fill') (fills[current] ||= []).pop();
  else if (step.t === 'add'){ list.pop(); recompose = true; }
  else if (step.t === 'del'){ list.splice(step.i, 0, step.s); recompose = true; }
  busy = true; await refresh(recompose); busy = false;
  save(); hideBravo(); updateThumb();
};

let frVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x => /^fr(-|_)FR/i.test(x.lang)) || v.find(x => /^fr/i.test(x.lang)) || null;
}

try { soundOn = localStorage.getItem('son-v1') !== 'off'; } catch(e) {}
const sayBtn = document.getElementById('saybtn');
function showSound(){ sayBtn.classList.toggle('hide', !soundOn); }
function toggleSound(){
  soundOn = !soundOn; showSound();
  try { localStorage.setItem('son-v1', soundOn ? 'on' : 'off'); } catch(e) {}
  if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
}
showSound();
function say(text){
  if (!soundOn || !text || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; if (frVoice) u.voice = frVoice;
    u.rate = 0.9; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch(e) {}
}
/* Le nom du dessin s'affiche à la place des couleurs pendant 4 secondes */
const trayEl = document.querySelector('.tray'), nameCard = document.getElementById('namecard');
let nameT;
function showName(text){
  if (!text) return;
  nameCard.textContent = text.charAt(0).toUpperCase() + text.slice(1); nameCard.hidden = false; trayEl.classList.add('naming');
  nameCard.style.animation = 'none'; void nameCard.offsetWidth; nameCard.style.animation = '';
  clearTimeout(nameT); nameT = setTimeout(hideName, 4000);
}
function hideName(){ nameCard.hidden = true; trayEl.classList.remove('naming'); }
nameCard.addEventListener('click', hideName);
function announce(){ say(NAMES[current]); showName(NAMES[current]); }
document.getElementById('saybtn').onclick = announce;

/* ---------- Nouvelle version du site : rechargement automatique (les coloriages sont gardés) ---------- */
const BUILD = VER.slice(3);
async function checkUpdate(){
  try {
    const r = await fetch('version.txt?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (v && v !== BUILD) location.reload();
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
setInterval(() => { if (!document.hidden && !homeEl.hidden) checkUpdate(); }, 5*60*1000);
checkUpdate();

/* ---------- Installer l'appli (espace parents) ---------- */
let installPrompt = null;
const parentsBtn = document.getElementById('parents'), gate = document.getElementById('gate'), gateBox = document.getElementById('gate-box');
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (!isInstalled()) parentsBtn.hidden = false;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { parentsBtn.hidden = true; closeGate(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

const NOMBRES = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf'];
let gateAnswer = 0, typed = '', gateNext = null;
function closeGate(){ gate.hidden = true; }
gate.addEventListener('click', e => { if (e.target === gate) closeGate(); });
function openGate(next, why){
  gateNext = next || showInstall;
  const a = 2 + Math.floor(Math.random()*2), b = 2 + Math.floor(Math.random()*8);   // tables de 2 et 3 seulement
  gateAnswer = a*b; typed = '';
  gateBox.innerHTML = `<h2 id="gate-title">Espace parents</h2>
    <p>Question pour les parents :</p>
    <p class="gate-q">${NOMBRES[a]} fois ${NOMBRES[b]} ?</p>
    <div class="gate-ans" id="gate-ans" aria-live="polite">&nbsp;</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="del" aria-label="Effacer">←</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button></div>
    <button class="gate-close" data-k="close">Annuler</button>`;
  gate.hidden = false;
}
gateBox.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.k, ans = document.getElementById('gate-ans');
  if (k === 'close') return closeGate();
  if (k === 'del') typed = typed.slice(0,-1);
  else if (k === 'ok'){
    if (Number(typed) === gateAnswer) return gateNext();
    typed = ''; ans.classList.remove('bad'); void ans.offsetWidth; ans.classList.add('bad');
  } else if (typed.length < 3) typed += k;
  if (ans) ans.innerHTML = typed || '&nbsp;';
});
function showInstall(){
  if (installPrompt){
    const p = installPrompt; installPrompt = null;
    p.prompt();
    p.userChoice.then(c => { if (c.outcome === 'accepted') parentsBtn.hidden = true; }).finally(closeGate);
    gateBox.innerHTML = `<h2>Installation…</h2><p>Confirmez dans la fenêtre du téléphone.</p>`;
    return;
  }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  gateBox.innerHTML = `<h2>Installer Coloriaz</h2>
    <ol class="gate-steps">${ios
      ? `<li>Touchez le bouton <b>Partager</b> (le carré avec une flèche vers le haut).</li><li>Choisissez <b>« Sur l'écran d'accueil »</b>.</li><li>Touchez <b>Ajouter</b>.</li>`
      : `<li>Touchez les <b>trois points ⋮</b> en haut à droite du navigateur.</li><li>Choisissez <b>« Ajouter à l'écran d'accueil »</b> ou <b>« Installer l'application »</b>.</li><li>Confirmez avec <b>Installer</b> ou <b>Ajouter</b>.</li>`}</ol>
    <button class="gate-close" data-k="close">Fermer</button>`;
}
parentsBtn.onclick = () => openGate(showInstall);
function showSettings(){
  gateBox.innerHTML = `<h2 id="gate-title">Menu</h2>
    <div class="set-list">
      <button class="set-item" data-k="home"><svg viewBox="0 0 32 32"><path d="M5 15 16 6l11 9"/><path d="M8 13v13h16V13"/><path d="M14 26v-7h4v7"/></svg>Accueil</button>
      <button class="set-item" data-k="sound"><svg viewBox="0 0 32 32">${soundOn ? '<path d="M6 12h5l7-6v20l-7-6H6z"/><path d="M22 11c2 2.5 2 7.5 0 10"/><path d="M25.5 8c4 4.5 4 11.5 0 16"/>' : '<path d="M6 12h5l7-6v20l-7-6H6z"/><path d="M22 12l7 8M29 12l-7 8"/>'}</svg>${soundOn ? 'Son activé' : 'Son coupé'}<svg class="lock" viewBox="0 0 24 24" aria-label="réservé aux parents"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <hr class="set-sep">
    </div>
    <div class="menucats">
      ${THEMES.map((t,i) => `<button class="set-item mcat${t===theme ? ' cur' : ''}" data-k="theme" data-i="${i}"><span class="mpic"><img alt="" src="covers/${t.id}.png${VER}"></span><b>${t.label}</b></button>`).join('')}
    </div>
    <button class="gate-close" data-k="close">Fermer</button>`;
  gate.hidden = false;
}
gateBox.addEventListener('click', e => {
  const b = e.target.closest('.set-item'); if (!b) return;
  const k = b.dataset.k;
  if (k === 'home'){ closeGate(); return showHome(); }
  if (k === 'sound') return openGate(() => { toggleSound(); showSettings(); });
  if (k === 'theme'){ closeGate(); return openTheme(THEMES[+b.dataset.i]); }
});
document.getElementById('menubtn').onclick = showSettings;
</script>
